<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">CampusHub product preview</title>
  <desc id="desc">Three CampusHub interface previews: dashboard, event discovery and admin moderation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <text x="70" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">CampusHub</text>
  <text x="70" y="105" fill="#64748b" font-family="Arial, sans-serif" font-size="16">A connected home for university clubs and campus life</text>
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="390" height="520" rx="18" fill="#fff"/>
    <rect x="70" y="150" width="390" height="64" rx="18" fill="#0f172a"/>
    <rect x="70" y="196" width="390" height="18" fill="#0f172a"/>
    <circle cx="108" cy="182" r="18" fill="#6366f1"/><text x="101" y="189" fill="#fff" font-family="Arial" font-size="16" font-weight="700">C</text>
    <text x="140" y="188" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Dashboard</text>
    <text x="101" y="259" fill="#94a3b8" font-family="Arial" font-size="12" font-weight="700">OVERVIEW</text>
    <rect x="100" y="280" width="330" height="78" rx="12" fill="#eef2ff"/><text x="120" y="308" fill="#4f46e5" font-family="Arial" font-size="13">Upcoming events</text><text x="120" y="338" fill="#0f172a" font-family="Arial" font-size="26" font-weight="700">08</text>
    <rect x="100" y="378" width="155" height="110" rx="12" fill="#f8fafc"/><text x="120" y="408" fill="#64748b" font-family="Arial" font-size="12">My clubs</text><text x="120" y="453" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">04</text>
    <rect x="275" y="378" width="155" height="110" rx="12" fill="#f8fafc"/><text x="295" y="408" fill="#64748b" font-family="Arial" font-size="12">Notifications</text><text x="295" y="453" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">12</text>
    <text x="100" y="540" fill="#0f172a" font-family="Arial" font-size="15" font-weight="700">Next on your calendar</text><rect x="100" y="560" width="330" height="62" rx="10" fill="#f8fafc"/><circle cx="126" cy="591" r="13" fill="#c7d2fe"/><text x="153" y="588" fill="#334155" font-family="Arial" font-size="13" font-weight="700">Robotics Open Lab</text><text x="153" y="607" fill="#64748b" font-family="Arial" font-size="11">Today · Innovation Hub</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="505" y="150" width="390" height="520" rx="18" fill="#fff"/>
    <rect x="505" y="150" width="390" height="82" rx="18" fill="url(#brand)"/><text x="540" y="188" fill="#c7d2fe" font-family="Arial" font-size="12" font-weight="700">DISCOVER</text><text x="540" y="216" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Find your next event</text>
    <rect x="540" y="260" width="320" height="42" rx="10" fill="#f8fafc"/><circle cx="561" cy="281" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="582" y="286" fill="#94a3b8" font-family="Arial" font-size="12">Search events and clubs</text>
    <rect x="540" y="330" width="320" height="100" rx="12" fill="#eef2ff"/><rect x="558" y="348" width="52" height="52" rx="10" fill="#c7d2fe"/><text x="628" y="365" fill="#1e1b4b" font-family="Arial" font-size="15" font-weight="700">Debate Night</text><text x="628" y="386" fill="#475569" font-family="Arial" font-size="12">Public Speaking Society</text><text x="628" y="405" fill="#6366f1" font-family="Arial" font-size="11" font-weight="700">8 days from now · Paid</text>
    <rect x="540" y="450" width="320" height="100" rx="12" fill="#f8fafc"/><rect x="558" y="468" width="52" height="52" rx="10" fill="#d1fae5"/><text x="628" y="485" fill="#0f172a" font-family="Arial" font-size="15" font-weight="700">Green Campus Week</text><text x="628" y="506" fill="#475569" font-family="Arial" font-size="12">Green Campus Initiative</text><text x="628" y="525" fill="#059669" font-family="Arial" font-size="11" font-weight="700">Volunteer registration open</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="940" y="150" width="390" height="520" rx="18" fill="#fff"/>
    <rect x="940" y="150" width="390" height="64" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="975" y="188" fill="#0f172a" font-family="Arial" font-size="17" font-weight="700">Admin workspace</text><rect x="1192" y="174" width="105" height="28" rx="14" fill="#eef2ff"/><text x="1210" y="192" fill="#4f46e5" font-family="Arial" font-size="11" font-weight="700">Administrator</text>
    <text x="975" y="260" fill="#64748b" font-family="Arial" font-size="12" font-weight="700">MODERATION QUEUE</text>
    <rect x="975" y="282" width="320" height="76" rx="11" fill="#fff1f2"/><circle cx="1002" cy="320" r="14" fill="#ffe4e6"/><text x="1028" y="314" fill="#0f172a" font-family="Arial" font-size="14" font-weight="700">Reports awaiting review</text><text x="1028" y="336" fill="#e11d48" font-family="Arial" font-size="22" font-weight="700">07</text>
    <text x="975" y="405" fill="#0f172a" font-family="Arial" font-size="15" font-weight="700">Recent activity</text>
    <rect x="975" y="428" width="320" height="54" rx="9" fill="#f8fafc"/><circle cx="997" cy="455" r="7" fill="#f59e0b"/><text x="1016" y="452" fill="#334155" font-family="Arial" font-size="12">Club approval pending</text><text x="1016" y="469" fill="#94a3b8" font-family="Arial" font-size="10">Public Speaking Society · 2h ago</text>
    <rect x="975" y="496" width="320" height="54" rx="9" fill="#f8fafc"/><circle cx="997" cy="523" r="7" fill="#10b981"/><text x="1016" y="520" fill="#334155" font-family="Arial" font-size="12">Payment approved</text><text x="1016" y="537" fill="#94a3b8" font-family="Arial" font-size="10">Inter-University Debate Night · 4h ago</text>
    <rect x="975" y="580" width="145" height="36" rx="9" fill="#4f46e5"/><text x="1004" y="603" fill="#fff" font-family="Arial" font-size="12" font-weight="700">Review queue</text>
  </g>
</svg>
